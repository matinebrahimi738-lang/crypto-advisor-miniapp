<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crypto Advisor</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🚀 Crypto Advisor</h1>

<p class="version">
نسخه 1.0.1.2
</p>

<p>
تحلیل هوشمند ارز دیجیتال
</p>

<input
id="coin"
type="text"
placeholder="نام ارز (مثلاً BTC)"
>

<br>

<input
id="price"
type="number"
placeholder="قیمت فعلی ارز"
>

<br><br>

<button onclick="analyze()">
🔍 تحلیل کن
</button>


<div class="result-box">

<h2 id="result">
نتیجه تحلیل اینجا نمایش داده می‌شود
</h2>

</div>


</div>


<script src="app.js"></script>

</body>

</html>
